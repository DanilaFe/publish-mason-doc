name: 'Publish Mason Documentation'
description: 'Generate Chapel Mason project documentation with mason doc and deploy to GitHub Pages'

inputs:
  chapel-version:
    description: 'Chapel version to install (e.g. "2.8.0" or "latest")'
    required: false
    default: 'latest'
  source-dir:
    description: 'Relative path to the mason project root within the repository'
    required: false
    default: '.'
  docs-dir:
    description: 'Subdirectory (relative to source-dir) where mason doc writes its output'
    required: false
    default: 'doc'
  token:
    description: 'GitHub token used for Pages deployment'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Resolve Chapel version
      id: resolve-version
      shell: bash
      run: |
        VERSION="${{ inputs.chapel-version }}"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chapel-lang/chapel/releases/latest \
            | jq -r '.tag_name')
        fi
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "::error::Failed to resolve Chapel version. Specify an explicit chapel-version input."
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install Chapel
      shell: bash
      run: |
        VERSION="${{ steps.resolve-version.outputs.version }}"
        UBUNTU_VERSION=$(lsb_release -rs | cut -d. -f1)
        ARCH=$(dpkg --print-architecture)
        EXPECTED_DEB="chapel-${VERSION}-1.ubuntu${UBUNTU_VERSION}.${ARCH}.deb"

        RELEASE_JSON=$(curl -sf \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/chapel-lang/chapel/releases/tags/${VERSION}")

        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r \
          ".assets[] | select(.name == \"${EXPECTED_DEB}\") | .browser_download_url")

        if [ -z "$DOWNLOAD_URL" ]; then
          AVAILABLE=$(echo "$RELEASE_JSON" | jq -r '[.assets[].name | select(endswith(".deb"))] | join(", ")')
          echo "::error::Could not find ${EXPECTED_DEB} in Chapel ${VERSION} release. Available .deb packages: ${AVAILABLE}"
          exit 1
        fi

        echo "Downloading ${EXPECTED_DEB}..."
        curl -fsSL -o chapel.deb "$DOWNLOAD_URL"
        sudo apt-get install -y ./chapel.deb
        rm chapel.deb

    - name: Generate documentation
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.source-dir }}
      run: mason doc

    - name: Configure Pages
      uses: actions/configure-pages@v5
      with:
        token: ${{ inputs.token }}

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.workspace }}/${{ inputs.source-dir }}/${{ inputs.docs-dir }}

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
